<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Кадастр</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="map" aria-label="Карта"></div>

<!-- Пошук -->
<header class="top">
  <form id="searchForm" class="search" autocomplete="off" role="search">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="text" inputmode="numeric" enterkeyhint="search"
           placeholder="Кадастровий номер" aria-label="Кадастровий номер" maxlength="22">
    <button type="button" id="qClear" class="icon-btn" hidden aria-label="Очистити">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button type="button" id="menuBtn" class="avatar" aria-label="Меню"></button>
  </form>
  <ul id="recent" class="recent" hidden></ul>
  <div id="banner" class="banner" hidden></div>
</header>

<!-- Кнопки карти -->
<div class="fabs">
  <button id="layersBtn" class="fab" aria-label="Шари">
    <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
  </button>
  <button id="locateBtn" class="fab" aria-label="Моє місце">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
  </button>
</div>

<div id="layersPop" class="pop" hidden>
  <div class="seg" role="radiogroup" aria-label="Підкладка">
    <button data-base="sat" class="on">Супутник</button>
    <button data-base="osm">Схема</button>
  </div>
  <label class="row-toggle"><span>Ділянки ДЗК</span><input type="checkbox" id="dzkToggle" checked></label>
  <p class="hint" id="layerHint" hidden></p>
</div>

<!-- Шторка ділянки -->
<section id="sheet" class="sheet" aria-live="polite" hidden>
  <div class="grab" id="grab"><span></span></div>
  <div id="sheetBody"></div>
</section>

<!-- Бокова/повноекранна панель -->
<div id="scrim" class="scrim" hidden></div>
<aside id="panel" class="panel" hidden aria-modal="true" role="dialog">
  <div class="panel-head">
    <button class="icon-btn" id="panelBack" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h2 id="panelTitle">Меню</h2>
    <button class="icon-btn" id="panelClose" aria-label="Закрити"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="panelBody" class="panel-body"></div>
</aside>

<div id="toast" class="toast" hidden></div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
